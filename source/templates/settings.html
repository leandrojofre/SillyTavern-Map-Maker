<div class="extension-template-custom-css">
	<div class="inline-drawer">
		<div class="inline-drawer-toggle inline-drawer-header">
			<b>Extension Template</b>
			<div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
		</div>

		<div id="extension-template-settings-window" class="inline-drawer-content p-15px">
			<div class="flex-container flex-column separator-bottom">
				<b>Settings</b>

				<label class="flex-container">
					<input id="extension-template-enabled" setting="enabled" type="checkbox" />
					Enable/Disable the extension
				</label>
			</div>

			<div class="flex-container flex-column mb-10px">
				<b>Debug settings</b>

				<div class="flex-container">
					<input id="extension-template-check-configuration" class="menu_button" type="button" value="Check Configuration" />
					Print the configuration values ​​through the console
				</div>

				<label class="flex-container">
					<input id="extension-template-debug" setting="debug" type="checkbox" />
					Enable/Disable the debug console logs
				</label>
			</div>
		</div>
	</div>
</div>
